<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description"
    content="Compare & apply for credit cards, bank accounts, demat accounts, loans and insurance from 50+ trusted financial partners on Finovia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <title>Finovia - Smart Financial Choices, Made Simple</title>
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('finovia_mode') || 'system';
        var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (mode === 'dark' || (mode === 'system' && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
